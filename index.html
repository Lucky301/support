<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPRACORE</title>
<meta name="description" content="SUPRACORE — 일상의 일을 가볍게 만드는 앱을 만듭니다. Apps that make everyday work lighter.">
<link rel="icon" href="support/pdf-works/app-icon.png">
<style>
  :root { --bg:#f6f5f2; --ink:#14161c; --muted:#5d6270; --line:#dcdad4; --card:#ffffff; --accent:#2f5bd3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1016; --ink:#eef0f5; --muted:#9aa1b1; --line:#262a35; --card:#161923; --accent:#8fb0ff; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  main { flex: 1; width: 100%; max-width: 880px; margin: 0 auto; padding: 18vh 24px 64px; }
  .wordmark { font-size: clamp(40px, 9vw, 76px); font-weight: 800; letter-spacing: .14em; line-height: 1; margin: 0; }
  .tagline { margin: 22px 0 0; font-size: clamp(17px, 2.4vw, 21px); color: var(--muted); }
  .tagline span { display: block; font-size: .85em; }
  h2 { margin: 72px 0 16px; font-size: 13px; letter-spacing: .16em; font-weight: 700; color: var(--muted); }
  .product { display: flex; align-items: center; gap: 18px; padding: 18px 20px; background: var(--card);
             border: 1px solid var(--line); border-radius: 18px; color: inherit; text-decoration: none; max-width: 520px;
             transition: border-color .15s, transform .15s; }
  .product:hover { border-color: var(--accent); transform: translateY(-1px); }
  .product:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
  .product img { width: 56px; height: 56px; border-radius: 13px; flex: none; }
  .product strong { display: block; font-size: 18px; }
  .product small { color: var(--muted); font-size: 14px; }
  .product .go { margin-left: auto; color: var(--accent); font-size: 22px; }
  footer { width: 100%; max-width: 880px; margin: 0 auto; padding: 24px; border-top: 1px solid var(--line);
           display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); }
  a.mail { color: var(--accent); text-underline-offset: 3px; }
  @media (max-width: 600px) { main { padding-top: 12vh; } h2 { margin-top: 56px; } }
</style>
</head>
<body>
<main>
  <h1 class="wordmark">SUPRACORE</h1>
  <p class="tagline">일상의 일을 가볍게 만드는 앱을 만듭니다.<span>Apps that make everyday work lighter.</span></p>

  <h2>APPS</h2>
  <a class="product" href="support/pdf-works/">
    <img src="support/pdf-works/app-icon.png" alt="" width="56" height="56">
    <span><strong>PDF Works</strong><small>변환·편집·스캔 · iPhone · iPad</small></span>
    <span class="go" aria-hidden="true">→</span>
  </a>
</main>
<footer>
  <span>© 2026 SUPRACORE</span>
  <a class="mail" href="mailto:support@supracore.co.kr">support@supracore.co.kr</a>
</footer>
</body>
</html>
